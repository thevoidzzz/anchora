services:
  postgres:
    image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a # pg16
    environment:
      POSTGRES_USER: anchora
      POSTGRES_DB: anchora
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchora -d anchora"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://anchora@postgres:5432/anchora
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  tests:
    build:
      context: .
      target: tests
    environment:
      DATABASE_URL: postgresql://anchora@postgres:5432/anchora
    depends_on:
      postgres:
        condition: service_healthy
